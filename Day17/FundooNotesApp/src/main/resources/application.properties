spring.application.name=FundooNotesApp

# ---------- Database ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fundoo_notes?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- JWT ----------
jwt.secret=${JWT_SECRET:mysupersecretkeymysupersecretkey1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---------- Mail (used by the JMS email listener) ----------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# When false, the email listener logs the email to the console instead of
# actually sending it -- lets you test the JMS flow without SMTP creds.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@fundoonotes.com}
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:4200/reset-password}

# ---------- JMS / ActiveMQ Artemis (embedded broker, no install needed) ----------
spring.artemis.mode=embedded
spring.artemis.embedded.enabled=true
spring.artemis.embedded.persistent=false
spring.artemis.embedded.queues=email.queue
spring.artemis.user=${ARTEMIS_USER:artemis}
spring.artemis.password=${ARTEMIS_PASSWORD:artemis}

# ---------- RabbitMQ ----------
# Second message broker, alongside the embedded Artemis one above:
#   - note-activity audit events (new)
#   - a parallel email producer/listener, so the two brokers can be compared
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
# Retries a failed publish a few times before giving up, instead of losing it silently
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3

# How often ReminderScheduler checks the DB for due note reminders (ms).
# A reminder fires anywhere from 0 to this many ms after its reminderAt time.
app.reminders.poll-interval-ms=${REMINDER_POLL_INTERVAL_MS:60000}

# ---------- Redis ----------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis
# Default cache TTL (ms) applied in RedisConfig
app.cache.ttl-minutes=${CACHE_TTL_MINUTES:10}
