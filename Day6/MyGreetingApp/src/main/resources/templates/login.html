<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - GreetingApp</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<header class="navbar">

    <div class="logo">
        GreetingApp
    </div>

    <nav>

        <a th:href="@{/}">
            Home
        </a>

        <a th:href="@{/register}">
            Register
        </a>

    </nav>

</header>


<main class="form-container">

    <div class="form-card">

        <h1>
            Welcome Back
        </h1>

        <p class="form-subtitle">
            Login to continue to GreetingApp.
        </p>


        <!-- Login error -->

        <div class="error-message"
             th:if="${loginError}"
             th:text="${loginError}">
        </div>


        <form th:action="@{/login}"
              method="post">


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <button
                type="submit"
                class="btn primary full-width">

                Login

            </button>

        </form>


        <p class="form-footer">

            Don't have an account?

            <a th:href="@{/register}">
                Register here
            </a>

        </p>

    </div>

</main>

</body>

</html>
